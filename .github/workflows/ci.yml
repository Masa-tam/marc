name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: '17 18 * * *'
  workflow_dispatch:
    inputs:
      full_validation:
        description: Run every test, including long boundary and differential campaigns
        type: boolean
        default: true

permissions:
  contents: read

env:
  MARC_CI_SCOPE: ${{ (github.event_name == 'schedule' || inputs.full_validation) && 'complete' || 'regular' }}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

jobs:
  validation-plan:
    name: Select validation work
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      run: ${{ steps.plan.outputs.run }}
    steps:
      - uses: actions/checkout@v7
      - name: Test validation history policy
        run: python3 -B tests/ci_validation_gate_tests.py
      - name: Check complete-validation history
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci_validation_gate.py

  windows-msvc:
    needs: validation-plan
    if: needs.validation-plan.outputs.run == 'true'
    name: Windows / Visual Studio 2026 / MSBuild
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Configure
        run: cmake --preset windows-msvc -DMARC_BUILD_BENCHMARKS=ON -DMARC_BUILD_FUZZERS=OFF
      - name: Record validation scope
        shell: pwsh
        run: '"Validation scope: $env:MARC_CI_SCOPE; revision: $env:GITHUB_SHA" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append'
      - name: Build
        run: cmake --build --preset windows-msvc-release --parallel
      - name: Test (regular)
        if: env.MARC_CI_SCOPE == 'regular'
        run: ctest --preset windows-msvc-release --parallel 2 --label-exclude '^ci-deep$' --no-tests=error
      - name: Test (complete)
        if: env.MARC_CI_SCOPE == 'complete'
        run: ctest --preset windows-msvc-release --parallel 2 --no-tests=error
      - name: Generate interoperability bundle
        shell: pwsh
        run: >-
          ./tests/create_interoperability_bundle.ps1
          -MarcCli '${{ github.workspace }}/out/build/windows-msvc/Release/marc.exe'
          -OutputDirectory '${{ github.workspace }}/out/interoperability/windows-msvc-x64'
          -Platform 'windows-msvc-x64'
          -Compiler 'MSVC via Visual Studio 2026'
          -SourceRevision '${{ github.sha }}'
      - name: Upload interoperability bundle
        uses: actions/upload-artifact@v7
        with:
          name: marc-interoperability-windows-msvc-x64
          path: out/interoperability/windows-msvc-x64
          if-no-files-found: error

  ubuntu-ninja:
    needs: validation-plan
    if: needs.validation-plan.outputs.run == 'true'
    name: Ubuntu 24.04 / Ninja
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Configure
        run: cmake --preset ninja-release -DMARC_BUILD_BENCHMARKS=ON -DMARC_BUILD_FUZZERS=OFF
      - name: Record validation scope
        shell: pwsh
        run: '"Validation scope: $env:MARC_CI_SCOPE; revision: $env:GITHUB_SHA" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append'
      - name: Build
        run: cmake --build --preset ninja-release
      - name: Test (regular)
        if: env.MARC_CI_SCOPE == 'regular'
        run: ctest --preset ninja-release --parallel 2 --label-exclude '^ci-deep$' --no-tests=error
      - name: Test (complete)
        if: env.MARC_CI_SCOPE == 'complete'
        run: ctest --preset ninja-release --parallel 2 --no-tests=error
      - name: Generate interoperability bundle
        shell: pwsh
        run: >-
          ./tests/create_interoperability_bundle.ps1
          -MarcCli '${{ github.workspace }}/out/build/ninja-release/marc'
          -OutputDirectory '${{ github.workspace }}/out/interoperability/ubuntu-ninja-x64'
          -Platform 'ubuntu-ninja-x64'
          -Compiler 'default Ubuntu 24.04 C++ compiler via Ninja'
          -SourceRevision '${{ github.sha }}'
      - name: Upload interoperability bundle
        uses: actions/upload-artifact@v7
        with:
          name: marc-interoperability-ubuntu-ninja-x64
          path: out/interoperability/ubuntu-ninja-x64
          if-no-files-found: error

  installed-package:
    needs: validation-plan
    if: needs.validation-plan.outputs.run == 'true'
    name: ${{ matrix.os_name }} / ${{ matrix.linkage }} package
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        os_name: [Windows, Ubuntu]
        linkage: [shared, static]
        include:
          - os_name: Windows
            runner: windows-2025-vs2026
            generator: Visual Studio 18 2026
            platform_args: -A x64
          - os_name: Ubuntu
            runner: ubuntu-24.04
            generator: Ninja
            platform_args: -DCMAKE_BUILD_TYPE=Release
    steps:
      - uses: actions/checkout@v7
      - name: Configure package
        shell: pwsh
        run: |
          $shared = if ('${{ matrix.linkage }}' -eq 'shared') { 'ON' } else { 'OFF' }
          $static = if ('${{ matrix.linkage }}' -eq 'static') { 'ON' } else { 'OFF' }
          cmake -S . -B out/package -G '${{ matrix.generator }}' ${{ matrix.platform_args }} `
            "-DMARC_BUILD_SHARED:BOOL=$shared" "-DMARC_BUILD_STATIC:BOOL=$static" `
            -DMARC_BUILD_TESTS=OFF -DMARC_BUILD_EXAMPLES=OFF `
            -DMARC_BUILD_TOOLS=OFF -DMARC_BUILD_BENCHMARKS=OFF `
            -DCMAKE_INSTALL_PREFIX='${{ github.workspace }}/out/install'
      - name: Build and install package
        run: >-
          cmake --build out/package --config Release
          --target install --parallel
      - name: Configure installed consumer
        shell: pwsh
        run: >-
          cmake -S out/install/share/marc/examples -B out/consumer -G '${{ matrix.generator }}'
          ${{ matrix.platform_args }}
          -Dmarc_DIR='${{ github.workspace }}/out/install/lib/cmake/marc'
          -DMARC_EXPECTED_LINKAGE=${{ matrix.linkage }}
      - name: Build installed consumer
        run: cmake --build out/consumer --config Release --parallel
      - name: Run installed consumer on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PATH = '${{ github.workspace }}\out\install\bin;' + $env:PATH
          ctest --test-dir out/consumer -C Release --output-on-failure --timeout 600
      - name: Run installed consumer on Ubuntu
        if: runner.os == 'Linux'
        shell: bash
        run: >-
          LD_LIBRARY_PATH='${{ github.workspace }}/out/install/lib'
          ctest --test-dir out/consumer -C Release --output-on-failure --timeout 600

  complete-validation:
    name: Complete validation succeeded
    needs:
      - validation-plan
      - windows-msvc
      - ubuntu-ninja
      - installed-package
    if: >-
      success() &&
      needs.validation-plan.outputs.run == 'true' &&
      (github.event_name == 'schedule' || inputs.full_validation)
    runs-on: ubuntu-24.04
    steps:
      - name: Record complete-validation success
        run: echo 'Complete validation succeeded for this revision and run attempt.'
